name: CI/CD — Training Pipeline + Deploy to Render

on:
  push:
    branches:
      - master
  # Also run on Pull Requests to master (e.g. Dependabot updates), so changes
  # are tested BEFORE merging. On PRs only the CI part runs: the Docker image
  # is built to check it works, but it is not published or deployed.
  pull_request:
    branches:
      - master
  # Allows running the pipeline manually from the "Actions" tab
  workflow_dispatch:

# The default GITHUB_TOKEN needs permission to publish the Docker image
# to GitHub Container Registry (ghcr.io)
permissions:
  contents: read
  packages: write

env:
  # Docker image names must be lowercase
  IMAGE_NAME: ghcr.io/juan1639/mlops_diabetes

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      # Render deploy hook URL, stored as a repository secret
      # (Settings → Secrets and variables → Actions → RENDER_DEPLOY_HOOK)
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      # ======================================================================
      #  CI — Continuous training (data → model → quality gate)
      # ======================================================================

      # Download the repository files onto the runner
      - name: Checkout code
        uses: actions/checkout@v7
      # Install the Python version used in development
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Install all project libraries + dev tools (pytest, ruff)
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Static checks: unused imports, undefined names, style errors...
      - name: Lint (ruff)
        run: ruff check .
      # Unit tests (data cleaning/validation, quality gate, registry, API)
      - name: Run tests
        run: pytest
      # Log in to GitHub Container Registry with the workflow's own token
      # (needed to restore the previous model and to publish the new image;
      # skipped on Pull Requests, where the public image can still be pulled)
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Bring back the MLflow store (runs, registry, current champion) from the
      # image that is currently deployed, so evaluate_model.py can compare the
      # new model against the champion in production. If there is no previous
      # image (first run), training starts with an empty store.
      - name: Restore previous MLflow store
        run: |
          if docker pull "$IMAGE_NAME:latest"; then
            container=$(docker create "$IMAGE_NAME:latest")
            docker cp "$container:/app/mlruns" ./mlruns || echo "No mlruns/ in the previous image"
            docker rm "$container"
          else
            echo "No previous image: starting with an empty MLflow store"
          fi
          du -sh mlruns 2>/dev/null || true
      # Download Diabetes dataset and save to data/raw/
      - name: Load raw data
        run: python -m src.data.load_data
      # Validate raw data and every new file in data/incoming/
      - name: Validate data
        run: python -m src.data.validate_data
      # Merge data/incoming/*.csv, fill nulls, fix types → data/processed/train_v1.csv
      - name: Preprocess data
        run: python -m src.data.preprocess
      # Train LinearRegression, RandomForest and GradientBoosting; log runs to MLflow (mlruns/)
      - name: Train models
        run: python -m src.models.train
      # Register the best run (trained on the current data) as alias 'challenger'
      - name: Register model
        run: python -m src.models.register_model
      # Challenger vs champion on the current test set. The challenger becomes
      # 'champion' only if it passes the gate (rmse < 60, r2 > 0.44) and is not
      # worse than the current champion; otherwise the champion is kept.
      # Exit 1 (nothing deployed) only if NO model passes the gate.
      - name: Evaluate model
        run: python -m src.models.evaluate_model
      # Delete the model files of training runs that were never registered
      # (metrics and history are kept), so mlruns/ and the image stay small
      - name: Prune unregistered model files
        run: python -m src.models.prune_artifacts
      # Size of the MLflow store that goes into the image (it grows with each run)
      - name: MLflow store size
        run: du -sh mlruns

      # ======================================================================
      #  CD — Package the champion model in a Docker image and deploy it
      # ======================================================================
      # At this point mlruns/ exists on the runner with the 'champion' alias,
      # so the Dockerfile's "COPY mlruns/" works (mlruns/ is not in git).
      # (Log in to GHCR is done above, before restoring the previous store.)

      # Build the image and push it with two tags:
      #   :latest     → the one Render deploys
      #   :<commit>   → keeps a history to roll back to a previous version
      # On Pull Requests the image is only built (push: false), to check that
      # the Dockerfile still works with the proposed changes.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Ask Render to pull the new :latest image and restart the service.
      # RENDER_DEPLOY_HOOK is a repository secret (Settings → Secrets → Actions).
      # Skipped (not failed) while the secret has not been configured yet.
      # Never runs on Pull Requests: only merged code gets deployed.
      - name: Trigger deploy on Render
        if: ${{ github.event_name != 'pull_request' && env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
